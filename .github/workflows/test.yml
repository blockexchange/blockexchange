name: test

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6

    - name: start services
      # waits until postgres and bx report healthy (see healthchecks in docker-compose.yml)
      run: docker compose up -d --wait --wait-timeout 180 postgres bx

    - name: test
      run: docker compose up --no-deps --exit-code-from mtt mtt

    - name: logs
      if: failure()
      run: docker compose logs postgres bx

    - name: cleanup
      if: always()
      run: docker compose down -v
